[project]
name = "vectordb-from-scratch"
version = "0.1.0"
description = "Let's Build a Vector Database from Scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "faiss-cpu>=1.7",
    "chromadb>=0.4,<0.6",
    "onnxruntime<1.24",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vectordb.py"]   # standalone module, not a package directory
